[project]
name = "studsbor"
version = "0.1.0"
description = "Telegram-бот «Фонд студсовета»: добровольные взносы, сборы, рейтинг и отчётность"
requires-python = ">=3.12"
# Держите в синхронизации с requirements.txt (его использует Docker).
dependencies = [
    "aiogram>=3.13,<4",
    "fastapi>=0.115",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "apscheduler>=3.10,<4",
    "tzdata>=2024.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
