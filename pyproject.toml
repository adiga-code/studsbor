[project]
name = "studsbor"
version = "0.1.0"
description = "Telegram-бот «Фонд студсовета»: добровольные взносы, сборы, рейтинг и отчётность"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
